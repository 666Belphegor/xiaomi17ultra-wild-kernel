name: Build Xiaomi 17 Ultra (SM8850) 6.12 KernelSU-Next + WildKernels

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch/Commit dari YuzakiKokuban/android_kernel_xiaomi_sm8850'
        required: true
        default: 'main'
        type: string
      kernel_version_mode:
        description: 'Mode Versi Kernel (6.12.23 vs Default Repo 6.12.69)'
        required: true
        default: 'force_6.12.23'
        type: choice
        options:
          - force_6.12.23
          - repo_default
      ksu_branch:
        description: 'Branch KernelSU-Next (pershoot/KernelSU-Next untuk integrasi SUSFS)'
        required: true
        default: 'dev-susfs'
        type: string
      enable_susfs:
        description: 'Aktifkan SUSFS (simonpunk/susfs4ksu gki-android16-6.12)'
        required: true
        default: true
        type: boolean
      enable_nomount:
        description: 'Aktifkan NoMount VFS (maxsteeel/nomount)'
        required: true
        default: true
        type: boolean
      enable_bbg:
        description: 'Aktifkan Baseband Guard Partition Protection (vc-teahouse/Baseband-guard)'
        required: true
        default: true
        type: boolean
      enable_droidspaces:
        description: 'Aktifkan DroidSpaces Container Runtime + kABI 6.12 Patch'
        required: true
        default: true
        type: boolean
      enable_bbrv3_patch:
        description: 'Terapkan Patch BBRv3 6.12 dari WildKernels/kernel_patches'
        required: true
        default: true
        type: boolean
      device_codename:
        description: 'Codename Xiaomi 17 Series untuk AnyKernel3 (nezha = 17 Ultra)'
        required: true
        default: 'nezha'
        type: string
      create_release:
        description: 'Buat GitHub Release otomatis setelah build berhasil'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  KERNEL_REPO: "https://github.com/YuzakiKokuban/android_kernel_xiaomi_sm8850.git"
  WILD_PATCHES_REPO: "https://github.com/WildKernels/kernel_patches.git"
  DROIDSPACES_REPO: "https://github.com/ravindu644/Droidspaces-OSS.git"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "gki-android16-6.12"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  CLANG_VERSION: "clang-r536225" # AOSP LLVM 19 untuk GKI android16-6.12

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 1. Maksimalkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 2. Install Dependensi Build Kernel & Pahole (BTF/BPF)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves pahole lld llvm clang cpio lz4 \
            p7zip-full unzip zip curl wget jq gawk python3 python3-pip \
            ccache libdw-dev

      - name: 3. Setup Cache Kompilasi (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: sm8850-6.12-ccache-${{ github.run_id }}
          restore-keys: |
            sm8850-6.12-ccache-

      - name: 4. Clone Kernel Source Xiaomi 17 Ultra (SM8850)
        run: |
          git clone --depth=100 -b "${{ inputs.kernel_branch }}" "${KERNEL_REPO}" kernel_src
          cd kernel_src

          if [ "${{ inputs.kernel_version_mode }}" = "force_6.12.23" ]; then
            echo "::notice::Mencari commit 6.12.23 atau mengunci SUBLEVEL = 23 di Makefile..."
            COMMIT_23=$(git log --grep="6.12.23" -n 1 --format="%H" || true)
            if [ -n "${COMMIT_23}" ]; then
              git checkout "${COMMIT_23}"
            else
              sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 23/' Makefile
            fi
          fi

          KERNEL_COMMIT=$(git rev-parse --short=12 HEAD)
          echo "KERNEL_COMMIT=${KERNEL_COMMIT}" >> $GITHUB_ENV
          head -n 5 Makefile

      - name: 5. Download AOSP Clang Toolchain (LLVM 19 untuk GKI 6.12)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/clang"
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz"
          curl -L "${CLANG_URL}" -o clang.tar.gz
          tar -xzf clang.tar.gz -C "${GITHUB_WORKSPACE}/clang"
          rm -f clang.tar.gz
          echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH

      - name: 6. Clone Repositori Patch Pendukung (WildKernels, SUSFS, DroidSpaces)
        run: |
          git clone --depth=1 "${WILD_PATCHES_REPO}" wild_patches
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            git clone --depth=1 -b "${SUSFS_BRANCH}" "${SUSFS_REPO}" susfs4ksu
          fi
          if [ "${{ inputs.enable_droidspaces }}" = "true" ]; then
            git clone --depth=1 "${DROIDSPACES_REPO}" droidspaces
          fi

      - name: 7. Integrasi SUSFS 6.12 & KernelSU-Next
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            echo "::group::Menyalin file SUSFS ke dalam tree kernel 6.12"
            cp -rv ../susfs4ksu/kernel_patches/fs/* fs/
            cp -rv ../susfs4ksu/kernel_patches/include/linux/* include/linux/

            # Terapkan patch utama SUSFS untuk GKI 6.12
            SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "*50_add_susfs_in_gki*6.12*.patch" | head -n 1)
            if [ -n "${SUSFS_PATCH}" ]; then
              patch -p1 --forward --fuzz=3 < "${SUSFS_PATCH}" || true
            fi

            # Terapkan patch tambahan WildKernels (Unicode Fix / Ptrace Fix) jika ada
            for wp in ../wild_patches/common/*unicode*.patch ../wild_patches/gki_ptrace.patch; do
              if [ -f "$wp" ]; then
                patch -p1 --forward --fuzz=3 < "$wp" || true
              fi
            done
            echo "::endgroup::"

            echo "::group::Mengintegrasikan KernelSU-Next (pershoot dev-susfs branch)"
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/${{ inputs.ksu_branch }}/kernel/setup.sh" | bash -s "${{ inputs.ksu_branch }}"
            echo "::endgroup::"
          else
            echo "::group::Mengintegrasikan KernelSU-Next (Official)"
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            echo "::endgroup::"
          fi

      - name: 8. Integrasi NoMount VFS (maxsteeel/nomount)
        if: ${{ inputs.enable_nomount }}
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          echo "::group::Mengintegrasikan NoMount VFS"
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s dev
          echo "::endgroup::"

      - name: 9. Integrasi Baseband Guard / BBG (vc-teahouse/Baseband-guard)
        if: ${{ inputs.enable_bbg }}
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          echo "::group::Mengintegrasikan Baseband Guard LSM"
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          # Tambahkan baseband_guard ke default LSM list di security/Kconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          echo "::endgroup::"

      - name: 10. Integrasi DroidSpaces kABI Patch & WildKernels BBRv3 (6.12)
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          if [ "${{ inputs.enable_droidspaces }}" = "true" ]; then
            echo "::group::Menerapkan Patch kABI DroidSpaces untuk GKI 6.12"
            for p in ../droidspaces/Documentation/resources/kernel-patches/GKI/kernel-6.12/*.patch; do
              if [ -f "$p" ]; then
                echo "Applying $p..."
                patch -p1 --forward --fuzz=3 < "$p"
              fi
            done
            echo "::endgroup::"
          fi

          if [ "${{ inputs.enable_bbrv3_patch }}" = "true" ]; then
            echo "::group::Menerapkan Patch BBRv3 6.12 dari WildKernels"
            BBR_PATCH=$(find ../wild_patches/common -iname "*bbr*6.12*.patch" | head -n 1 || true)
            if [ -n "${BBR_PATCH}" ]; then
              patch -p1 --forward --fuzz=3 < "${BBR_PATCH}" || true
            fi
            echo "::endgroup::"
          fi

      - name: 11. Injeksi Konfigurasi Kconfig (WildKernels Stack ke gki_defconfig)
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          cat << 'EOF' >> "${DEFCONFIG}"

          # =========================================================
          # 1. KernelSU-Next & SUSFS Root Hiding
          # =========================================================
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          # Matikan OPEN_REDIRECT pada SUSFS agar tidak bentrok dengan NoMount VFS
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=n

          # =========================================================
          # 2. NoMount (VFS Path Redirection) & Baseband Guard (BBG)
          # =========================================================
          CONFIG_NOMOUNT=y
          CONFIG_BBG=y

          # =========================================================
          # 3. Networking: WireGuard, BBR, IPSet, CIFS
          # =========================================================
          CONFIG_WIREGUARD=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETWORK_FILESYSTEMS=y
          CONFIG_CIFS=y
          CONFIG_CIFS_ALLOW_INSECURE_LEGACY=y
          CONFIG_CIFS_UPCALL=y
          CONFIG_CIFS_XATTR=y
          CONFIG_CIFS_POSIX=y
          CONFIG_DNS_RESOLVER=y

          # =========================================================
          # 4. TMPFS: xattr & POSIX ACLs
          # =========================================================
          CONFIG_TMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y

          # =========================================================
          # 5. BPF: BTF / eBPF / FUSE-BPF
          # =========================================================
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_BPF_EVENTS=y
          CONFIG_FUSE_FS=y
          CONFIG_FUSE_BPF=y
          CONFIG_FUSE_PASSTHROUGH=y

          # =========================================================
          # 6. DroidSpaces (kABI-Safe GKI 6.12 Container Configs)
          # =========================================================
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_UTS_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_MACVLAN=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          # PENTING: Jangan aktifkan CONFIG_CFS_BANDWIDTH atau CONFIG_CGROUP_PIDS
          # karena merusak CRC kABI GKI 6.12 dan membuat vendor_dlkm gagal dimuat!
          EOF

          sed -i 's/check_defconfig//' build.config.gki || true

      - name: 12. Kompilasi Kernel GKI 6.12 (SM8850)
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="ccache clang"
          export LOCALVERSION="-android16-Wild-KSUNext"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "::group::Verifikasi Konfigurasi Akhir (.config)"
          grep -E "CONFIG_KSU|CONFIG_NOMOUNT|CONFIG_BBG|CONFIG_WIREGUARD|CONFIG_TCP_CONG_BBR|CONFIG_IP_SET|CONFIG_CIFS|CONFIG_TMPFS_POSIX_ACL|CONFIG_DEBUG_INFO_BTF|CONFIG_FUSE_|CONFIG_SYSVIPC" out/.config || true
          echo "::endgroup::"

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            Image Image.lz4 Image.gz

      - name: 13. Kemas menjadi Flashable ZIP dengan AnyKernel3 & Siapkan Metadata Release
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth=1 "${ANYKERNEL_REPO}" AnyKernel3
          rm -rf AnyKernel3/.git

          if [ -f "kernel_src/out/arch/arm64/boot/Image" ]; then
            cp kernel_src/out/arch/arm64/boot/Image AnyKernel3/
          elif [ -f "kernel_src/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel_src/out/arch/arm64/boot/Image.gz AnyKernel3/
          fi

          cat << EOF > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          properties() { '
          kernel.string=Xiaomi 17 Ultra (SM8850) KernelSU-Next + WildKernels
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${{ inputs.device_codename }}
          device.name2=pudding
          device.name3=pandora
          device.name4=popsicle
          supported.versions=16
          supported.patchlevels=
          '; }

          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

          BUILD_DATE="$(date +%Y%m%d-%H%M)"
          KVER=$(make -s -C kernel_src kernelversion)
          ZIP_NAME="Wild-KSUNext-${KVER}-SM8850-${{ inputs.device_codename }}-${BUILD_DATE}-AnyKernel3.zip"
          CONFIG_NAME="config-${KVER}-${{ inputs.device_codename }}-${BUILD_DATE}.txt"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder
          cd ..

          cp kernel_src/out/.config "${CONFIG_NAME}"
          ZIP_SHA256=$(sha256sum "${ZIP_NAME}" | awk '{print $1}')

          # Buat catatan rilis (Release Notes) Markdown
          cat << EOF > release_notes.md
          ### Xiaomi 17 Ultra (\`${{ inputs.device_codename }}\` / SM8850) — Linux \`${KVER}\` (KernelSU-Next + WildKernels)

          #### Informasi Build
          * **Perangkat Target**: Xiaomi 17 Ultra (\`${{ inputs.device_codename }}\`) & Xiaomi 17 Series (\`sm8850\`)
          * **Versi Kernel**: \`${KVER}-android16-Wild-KSUNext\`
          * **Sumber Kernel**: [YuzakiKokuban/android_kernel_xiaomi_sm8850](https://github.com/YuzakiKokuban/android_kernel_xiaomi_sm8850) (\`${{ inputs.kernel_branch }}\` @ \`${KERNEL_COMMIT}\`)
          * **Root Manager Base**: KernelSU-Next (\`${{ inputs.ksu_branch }}\`) — dikemas dengan **AnyKernel3**
          * **Toolchain**: AOSP LLVM/Clang (\`${CLANG_VERSION}\`)

          #### Daftar Fitur WildKernels yang Diaktifkan
          * **SUSFS (\`gki-android16-6.12\`)**: \`${{ inputs.enable_susfs }}\` (\`CONFIG_KSU_SUSFS_OPEN_REDIRECT=n\` untuk kompatibilitas NoMount)
          * **NoMount VFS Path Redirection**: \`${{ inputs.enable_nomount }}\` (\`CONFIG_NOMOUNT=y\`)
          * **Baseband Guard (BBG LSM Partition Protection)**: \`${{ inputs.enable_bbg }}\` (\`CONFIG_BBG=y\`)
          * **Networking Stack**: WireGuard, TCP BBR/BBRv3 (\`${{ inputs.enable_bbrv3_patch }}\`), IPSet, CIFS/SMB, FQ/CAKE
          * **TMPFS**: Extended Attributes (\`CONFIG_TMPFS_XATTR=y\`) & POSIX ACLs (\`CONFIG_TMPFS_POSIX_ACL=y\`)
          * **BPF Subsystem**: BTF (\`CONFIG_DEBUG_INFO_BTF=y\`), eBPF JIT, FUSE-BPF (\`CONFIG_FUSE_BPF=y\`)
          * **DroidSpaces Container Runtime**: \`${{ inputs.enable_droidspaces }}\` (GKI 6.12 kABI-Safe Padding Patch + IPC/PID/User Namespaces & \`DEVTMPFS\`)

          #### Verifikasi Checksum (SHA-256)
          \`\`\`text
          ${ZIP_SHA256}  ${ZIP_NAME}
          \`\`\`
          EOF

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "CONFIG_NAME=${CONFIG_NAME}" >> $GITHUB_ENV
          echo "KVER=${KVER}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${KVER}-${{ inputs.device_codename }}-${BUILD_DATE}" >> $GITHUB_ENV

      - name: 14. Upload Artifact AnyKernel3 ZIP & .config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.CONFIG_NAME }}
          retention-days: 14

      - name: 15. Buat GitHub Release Otomatis
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Xiaomi 17 Ultra (SM8850) Kernel ${KVER} — Wild-KSUNext (${{ env.BUILD_DATE }})"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.CONFIG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
