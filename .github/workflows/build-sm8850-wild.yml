name: Build Xiaomi 17 Ultra (SM8850) 6.12 KernelSU-Next + WildKernels (All Latest Commits)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch dari YuzakiKokuban/android_kernel_xiaomi_sm8850'
        required: true
        default: 'main'
        type: string
      kernel_version_mode:
        description: 'Mode Versi Kernel (6.12.23 vs Latest Commit Repo 6.12.69+)'
        required: true
        default: 'force_6.12.23'
        type: choice
        options:
          - force_6.12.23
          - repo_latest_head
      ksu_branch:
        description: 'Branch KernelSU-Next (dev-susfs dari pershoot untuk SUSFS, atau next)'
        required: true
        default: 'dev-susfs'
        type: string
      manager_mode:
        description: 'Mode Pembuatan 2 APK Manager (Normal + Spoofed) Latest KernelSU-Next'
        required: true
        default: 'fetch_latest_official'
        type: choice
        options:
          - fetch_latest_official
          - compile_from_source
      spoofed_package_name:
        description: 'Custom Package Name untuk Spoofed Manager (Khusus mode compile_from_source)'
        required: true
        default: 'com.android.system.settings.ksun'
        type: string
      enable_susfs:
        description: 'Aktifkan SUSFS Latest Commit (simonpunk/susfs4ksu gki-android16-6.12)'
        required: true
        default: true
        type: boolean
      enable_nomount:
        description: 'Aktifkan NoMount VFS Latest Commit (maxsteeel/nomount)'
        required: true
        default: true
        type: boolean
      enable_bbg:
        description: 'Aktifkan Baseband Guard Latest Commit (vc-teahouse/Baseband-guard)'
        required: true
        default: true
        type: boolean
      enable_droidspaces:
        description: 'Aktifkan DroidSpaces Latest Commit + kABI 6.12 Patch (ravindu644/Droidspaces-OSS)'
        required: true
        default: true
        type: boolean
      enable_wild_net_bpf_patches:
        description: 'Terapkan Patch Networking (BBRv3) & BPF/Security Terbaru dari WildKernels/kernel_patches'
        required: true
        default: true
        type: boolean
      device_codename:
        description: 'Codename Xiaomi 17 Series untuk AnyKernel3 (nezha = 17 Ultra)'
        required: true
        default: 'nezha'
        type: string
      create_release:
        description: 'Buat GitHub Release otomatis setelah build berhasil'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  KERNEL_REPO: "https://github.com/YuzakiKokuban/android_kernel_xiaomi_sm8850.git"
  KSUN_SUSFS_REPO: "https://github.com/pershoot/KernelSU-Next.git"
  KSUN_OFFICIAL_REPO: "https://github.com/KernelSU-Next/KernelSU-Next.git"
  SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
  SUSFS_BRANCH: "gki-android16-6.12"
  NOMOUNT_REPO: "https://github.com/maxsteeel/nomount.git"
  NOMOUNT_BRANCH: "dev"
  BBG_REPO: "https://github.com/vc-teahouse/Baseband-guard.git"
  BBG_BRANCH: "main"
  WILD_PATCHES_REPO: "https://github.com/WildKernels/kernel_patches.git"
  WILD_PATCHES_BRANCH: "main"
  DROIDSPACES_REPO: "https://github.com/ravindu644/Droidspaces-OSS.git"
  DROIDSPACES_BRANCH: "main"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  CLANG_VERSION: "clang-r536225" # AOSP LLVM 19 untuk GKI android16-6.12

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: 1. Maksimalkan Ruang Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: 2. Install Dependensi Build Kernel & Pahole (BTF/BPF)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git bc bison flex libssl-dev libelf-dev \
            libncurses-dev dwarves pahole lld llvm clang cpio lz4 \
            p7zip-full unzip zip curl wget jq gawk python3 python3-pip \
            ccache libdw-dev

      - name: 3. Setup Cache Kompilasi Objek Kernel (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: sm8850-6.12-ccache-${{ github.run_id }}
          restore-keys: |
            sm8850-6.12-ccache-

      - name: 4. Clone Kernel Source Xiaomi 17 Ultra (SM8850)
        run: |
          git clone --no-single-branch --depth=100 -b "${{ inputs.kernel_branch }}" "${KERNEL_REPO}" kernel_src
          cd kernel_src
          git fetch origin "${{ inputs.kernel_branch }}"
          git reset --hard "origin/${{ inputs.kernel_branch }}"

          if [ "${{ inputs.kernel_version_mode }}" = "force_6.12.23" ]; then
            echo "::notice::Mencari commit 6.12.23 atau mengunci SUBLEVEL = 23 pada HEAD terbaru..."
            COMMIT_23=$(git log --grep="6.12.23" -n 1 --format="%H" || true)
            if [ -n "${COMMIT_23}" ]; then
              git checkout "${COMMIT_23}"
            else
              sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 23/' Makefile
            fi
          fi

          KERNEL_COMMIT=$(git rev-parse --short=12 HEAD)
          echo "KERNEL_COMMIT=${KERNEL_COMMIT}" >> $GITHUB_ENV
          head -n 5 Makefile

      - name: 5. Download AOSP Clang Toolchain (LLVM 19 untuk GKI 6.12)
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/clang"
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz"
          curl -L "${CLANG_URL}" -o clang.tar.gz
          tar -xzf clang.tar.gz -C "${GITHUB_WORKSPACE}/clang"
          rm -f clang.tar.gz
          echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH

      - name: 6. Tarik Latest Commit (HEAD) Semua Repositori Fitur & Patch Upstream
        working-directory: ${{ github.workspace }}
        run: |
          echo "::group::Menarik Latest Commit (HEAD) dari Semua Upstream"

          # 1. WildKernels/kernel_patches (Networking BBRv3, BPF/FUSE-BPF, Ptrace, Unicode)
          git clone --depth=1 -b "${WILD_PATCHES_BRANCH}" "${WILD_PATCHES_REPO}" wild_patches
          WILD_SHA=$(git -C wild_patches rev-parse --short=8 HEAD)
          echo "WILD_PATCHES_SHA=${WILD_SHA}" >> $GITHUB_ENV
          echo "WildKernels/kernel_patches latest commit: ${WILD_SHA}"

          # 2. SUSFS (simonpunk/susfs4ksu branch gki-android16-6.12)
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            git clone --depth=1 -b "${SUSFS_BRANCH}" "${SUSFS_REPO}" susfs4ksu
            SUSFS_SHA=$(git -C susfs4ksu rev-parse --short=8 HEAD)
            echo "SUSFS_SHA=${SUSFS_SHA}" >> $GITHUB_ENV
            echo "simonpunk/susfs4ksu (${SUSFS_BRANCH}) latest commit: ${SUSFS_SHA}"
          else
            echo "SUSFS_SHA=disabled" >> $GITHUB_ENV
          fi

          # 3. NoMount VFS (maxsteeel/nomount branch dev / master)
          if [ "${{ inputs.enable_nomount }}" = "true" ]; then
            git clone --depth=1 -b "${NOMOUNT_BRANCH}" "${NOMOUNT_REPO}" nomount_src || \
              git clone --depth=1 "${NOMOUNT_REPO}" nomount_src
            NOMOUNT_SHA=$(git -C nomount_src rev-parse --short=8 HEAD)
            echo "NOMOUNT_SHA=${NOMOUNT_SHA}" >> $GITHUB_ENV
            echo "maxsteeel/nomount latest commit: ${NOMOUNT_SHA}"
          else
            echo "NOMOUNT_SHA=disabled" >> $GITHUB_ENV
          fi

          # 4. Baseband Guard / BBG (vc-teahouse/Baseband-guard branch main)
          if [ "${{ inputs.enable_bbg }}" = "true" ]; then
            git clone --depth=1 -b "${BBG_BRANCH}" "${BBG_REPO}" bbg_src
            BBG_SHA=$(git -C bbg_src rev-parse --short=8 HEAD)
            echo "BBG_SHA=${BBG_SHA}" >> $GITHUB_ENV
            echo "vc-teahouse/Baseband-guard latest commit: ${BBG_SHA}"
          else
            echo "BBG_SHA=disabled" >> $GITHUB_ENV
          fi

          # 5. DroidSpaces-OSS (ravindu644/Droidspaces-OSS branch main)
          if [ "${{ inputs.enable_droidspaces }}" = "true" ]; then
            git clone --depth=1 -b "${DROIDSPACES_BRANCH}" "${DROIDSPACES_REPO}" droidspaces
            DROIDSPACES_SHA=$(git -C droidspaces rev-parse --short=8 HEAD)
            echo "DROIDSPACES_SHA=${DROIDSPACES_SHA}" >> $GITHUB_ENV
            echo "ravindu644/Droidspaces-OSS latest commit: ${DROIDSPACES_SHA}"
          else
            echo "DROIDSPACES_SHA=disabled" >> $GITHUB_ENV
          fi

          # 6. AnyKernel3 (osm0sis/AnyKernel3)
          git clone --depth=1 "${ANYKERNEL_REPO}" AnyKernel3
          AK3_SHA=$(git -C AnyKernel3 rev-parse --short=8 HEAD)
          rm -rf AnyKernel3/.git
          echo "AK3_SHA=${AK3_SHA}" >> $GITHUB_ENV
          echo "osm0sis/AnyKernel3 latest commit: ${AK3_SHA}"

          echo "::endgroup::"

      - name: 7. Integrasi Latest Commit SUSFS 6.12 & KernelSU-Next
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            echo "::group::Menyalin File & Patch Terbaru SUSFS (${SUSFS_SHA}) ke Kernel 6.12"
            cp -rv ../susfs4ksu/kernel_patches/fs/* fs/
            cp -rv ../susfs4ksu/kernel_patches/include/linux/* include/linux/

            SUSFS_PATCH=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "*50_add_susfs_in_gki*6.12*.patch" | head -n 1)
            if [ -n "${SUSFS_PATCH}" ]; then
              patch -p1 --forward --fuzz=3 < "${SUSFS_PATCH}" || true
            fi
            echo "::endgroup::"

            echo "::group::Mengintegrasikan KernelSU-Next Latest Commit (${{ inputs.ksu_branch }})"
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/${{ inputs.ksu_branch }}/kernel/setup.sh" | bash -s "${{ inputs.ksu_branch }}"
            KSUN_SHA=$(git -C KernelSU-Next rev-parse --short=8 HEAD 2>/dev/null || git ls-remote "${KSUN_SUSFS_REPO}" "refs/heads/${{ inputs.ksu_branch }}" | awk '{print substr($1,1,8)}')
            echo "KSUN_SHA=${KSUN_SHA}" >> $GITHUB_ENV
            echo "::endgroup::"
          else
            echo "::group::Mengintegrasikan KernelSU-Next Official Latest Commit (next)"
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
            KSUN_SHA=$(git -C KernelSU-Next rev-parse --short=8 HEAD 2>/dev/null || git ls-remote "${KSUN_OFFICIAL_REPO}" "refs/heads/next" | awk '{print substr($1,1,8)}')
            echo "KSUN_SHA=${KSUN_SHA}" >> $GITHUB_ENV
            echo "::endgroup::"
          fi

      - name: 8. Integrasi Latest Commit NoMount VFS (maxsteeel/nomount)
        if: ${{ inputs.enable_nomount }}
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          echo "::group::Mengintegrasikan NoMount VFS Latest Commit (${NOMOUNT_SHA})"
          if [ -f "../nomount_src/kernel/setup.sh" ]; then
            bash ../nomount_src/kernel/setup.sh "${NOMOUNT_BRANCH}"
          else
            curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/${NOMOUNT_BRANCH}/kernel/setup.sh" | bash -s "${NOMOUNT_BRANCH}"
          fi
          echo "::endgroup::"

      - name: 9. Integrasi Latest Commit Baseband Guard / BBG (vc-teahouse/Baseband-guard)
        if: ${{ inputs.enable_bbg }}
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          echo "::group::Mengintegrasikan Baseband Guard LSM Latest Commit (${BBG_SHA})"
          if [ -f "../bbg_src/setup.sh" ]; then
            bash ../bbg_src/setup.sh
          else
            wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          fi
          # Pastikan baseband_guard terdaftar di default LSM list pada security/Kconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          echo "::endgroup::"

      - name: 10. Integrasi Latest Commit DroidSpaces (kABI 6.12) & WildKernels (Networking BBRv3 / BPF / Security)
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          if [ "${{ inputs.enable_droidspaces }}" = "true" ]; then
            echo "::group::Menerapkan Patch kABI DroidSpaces Terbaru (${DROIDSPACES_SHA}) untuk GKI 6.12"
            for p in ../droidspaces/Documentation/resources/kernel-patches/GKI/kernel-6.12/*.patch; do
              if [ -f "$p" ]; then
                echo "Applying DroidSpaces patch: $p"
                patch -p1 --forward --fuzz=3 < "$p" || true
              fi
            done
            echo "::endgroup::"
          fi

          if [ "${{ inputs.enable_wild_net_bpf_patches }}" = "true" ]; then
            echo "::group::Menerapkan Patch Networking (BBRv3) & BPF/Security Terbaru dari WildKernels (${WILD_PATCHES_SHA})"
            # 1. Patch BBRv3 kABI-compliant untuk android16-6.12
            BBR_PATCH=$(find ../wild_patches/common -iname "*bbr*6.12*.patch" | head -n 1 || true)
            if [ -n "${BBR_PATCH}" ]; then
              echo "Applying BBRv3 patch: ${BBR_PATCH}"
              patch -p1 --forward --fuzz=3 < "${BBR_PATCH}" || true
            fi

            # 2. Patch FUSE-BPF / BPF backports (jika ada untuk 6.12)
            for bpf_p in $(find ../wild_patches/common -iname "*fuse*6.12*.patch" -o -iname "*bpf*6.12*.patch" 2>/dev/null); do
              if [ -f "$bpf_p" ]; then
                echo "Applying BPF/FUSE-BPF patch: $bpf_p"
                patch -p1 --forward --fuzz=3 < "$bpf_p" || true
              fi
            done

            # 3. Patch Keamanan Root Hiding WildKernels (Unicode Bypass Fix & GKI Ptrace Fix)
            for sec_p in ../wild_patches/common/*unicode*6.1*.patch ../wild_patches/gki_ptrace.patch; do
              if [ -f "$sec_p" ]; then
                echo "Applying Security patch: $sec_p"
                patch -p1 --forward --fuzz=3 < "$sec_p" || true
              fi
            done
            echo "::endgroup::"
          fi

      - name: 11. Injeksi Konfigurasi Kconfig Lengkap (WildKernels Stack ke gki_defconfig)
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          cat << 'EOF' >> "${DEFCONFIG}"

          # =========================================================
          # 1. KernelSU-Next & SUSFS Root Hiding (Latest)
          # =========================================================
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          # Matikan OPEN_REDIRECT pada SUSFS agar tidak bentrok dengan NoMount VFS
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=n

          # =========================================================
          # 2. NoMount (VFS Path Redirection) & Baseband Guard (BBG)
          # =========================================================
          CONFIG_NOMOUNT=y
          CONFIG_BBG=y

          # =========================================================
          # 3. Networking: WireGuard, BBR, IPSet, CIFS
          # =========================================================
          CONFIG_WIREGUARD=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_NETiface=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETWORK_FILESYSTEMS=y
          CONFIG_CIFS=y
          CONFIG_CIFS_ALLOW_INSECURE_LEGACY=y
          CONFIG_CIFS_UPCALL=y
          CONFIG_CIFS_XATTR=y
          CONFIG_CIFS_POSIX=y
          CONFIG_CIFS_DFS_UPCALL=y
          CONFIG_DNS_RESOLVER=y

          # =========================================================
          # 4. TMPFS: xattr & POSIX ACLs
          # =========================================================
          CONFIG_TMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y

          # =========================================================
          # 5. BPF: BTF / eBPF / FUSE-BPF
          # =========================================================
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_DEBUG_INFO_BTF=y
          CONFIG_DEBUG_INFO_BTF_MODULES=y
          CONFIG_BPF_EVENTS=y
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_FUSE_FS=y
          CONFIG_FUSE_BPF=y
          CONFIG_FUSE_PASSTHROUGH=y

          # =========================================================
          # 6. DroidSpaces (kABI-Safe GKI 6.12 Container Configs)
          # =========================================================
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_UTS_NS=y
          CONFIG_NET_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_MACVLAN=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          # PENTING: Jangan aktifkan CONFIG_CFS_BANDWIDTH atau CONFIG_CGROUP_PIDS
          # karena merusak CRC kABI GKI 6.12 dan membuat vendor_dlkm gagal dimuat!
          EOF

          sed -i 's/check_defconfig//' build.config.gki || true

      - name: 12. Kompilasi Kernel GKI 6.12 (SM8850)
        working-directory: ${{ github.workspace }}/kernel_src
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="ccache clang"
          export LOCALVERSION="-android16-Wild-KSUNext"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "::group::Verifikasi Konfigurasi Akhir (.config)"
          grep -E "CONFIG_KSU|CONFIG_NOMOUNT|CONFIG_BBG|CONFIG_WIREGUARD|CONFIG_TCP_CONG_BBR|CONFIG_IP_SET|CONFIG_CIFS|CONFIG_TMPFS_POSIX_ACL|CONFIG_DEBUG_INFO_BTF|CONFIG_FUSE_|CONFIG_SYSVIPC" out/.config || true
          echo "::endgroup::"

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            Image Image.lz4 Image.gz

      - name: 13. Setup JDK 21 (Untuk Pembuatan / Kompilasi Manager APK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 14. Siapkan / Build 2 Varian KernelSU-Next Manager APK Terbaru (Normal & Spoofed)
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_managers_from_source() {
            echo "::group::Mengompilasi Normal & Spoofed KernelSU-Next Manager dari Latest Commit Source"
            if [ "${{ inputs.enable_susfs }}" = "true" ]; then
              git clone --depth=1 -b "${{ inputs.ksu_branch }}" "${KSUN_SUSFS_REPO}" ksun_manager_src
            else
              git clone --depth=1 -b next "${KSUN_OFFICIAL_REPO}" ksun_manager_src
            fi

            cd ksun_manager_src
            MGR_COMMIT=$(git rev-parse --short=8 HEAD)

            rustup target add aarch64-linux-android x86_64-linux-android
            cargo install cargo-ndk
            export ANDROID_NDK_HOME=$(ls -d ${ANDROID_HOME}/ndk/* | tail -n 1)

            mkdir -p manager/app/src/main/jniLibs/arm64-v8a
            cargo ndk -t arm64-v8a -o manager/app/src/main/jniLibs build --release --manifest-path userspace/ksud/Cargo.toml
            if [ -f "manager/app/src/main/jniLibs/arm64-v8a/ksud" ]; then
              mv manager/app/src/main/jniLibs/arm64-v8a/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so
            fi

            cd manager
            chmod +x gradlew

            # 1. Build NORMAL Manager APK
            ./gradlew assembleRelease --no-daemon
            BUILT_NORMAL=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            NORMAL_APK="KernelSU_Next_Manager_${MGR_COMMIT}-normal.apk"
            cp "${BUILT_NORMAL}" "${GITHUB_WORKSPACE}/${NORMAL_APK}"

            # 2. Build SPOOFED Manager APK
            rm -rf app/build/outputs/apk/release/*
            SPOOF_PKG="${{ inputs.spoofed_package_name }}"
            sed -i "s/applicationId = \"com.rifsxd.ksunext\"/applicationId = \"${SPOOF_PKG}\"/g" app/build.gradle.kts || true
            sed -i "s/applicationId \"com.rifsxd.ksunext\"/applicationId \"${SPOOF_PKG}\"/g" app/build.gradle.kts || true
            if [ -f "app/src/main/res/values/strings.xml" ]; then
              sed -i 's/>KernelSU Next</>System Settings</g' app/src/main/res/values/strings.xml || true
            fi

            ./gradlew assembleRelease --no-daemon
            BUILT_SPOOFED=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            SPOOFED_APK="KernelSU_Next_Manager_${MGR_COMMIT}-spoofed.apk"
            cp "${BUILT_SPOOFED}" "${GITHUB_WORKSPACE}/${SPOOFED_APK}"

            cd "${GITHUB_WORKSPACE}"
            echo "NORMAL_MANAGER_APK=${NORMAL_APK}" >> $GITHUB_ENV
            echo "SPOOFED_MANAGER_APK=${SPOOFED_APK}" >> $GITHUB_ENV
            echo "MANAGER_VERSION=source-${MGR_COMMIT}" >> $GITHUB_ENV
            echo "::endgroup::"
          }

          if [ "${{ inputs.manager_mode }}" = "fetch_latest_official" ]; then
            echo "::group::Mengambil Normal & Spoofed APK Latest KernelSU-Next Resmi"
            RELEASE_JSON=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest")

            MGR_TAG=$(echo "${RELEASE_JSON}" | jq -r '.tag_name // "latest"')

            NORMAL_URL=$(echo "${RELEASE_JSON}" | jq -r '.assets[]? | select((.name | endswith(".apk")) and ((.name | ascii_downcase | contains("spoof")) | not)) | .browser_download_url' | head -n 1)
            SPOOFED_URL=$(echo "${RELEASE_JSON}" | jq -r '.assets[]? | select((.name | endswith(".apk")) and (.name | ascii_downcase | contains("spoof"))) | .browser_download_url' | head -n 1)

            if [ -z "${SPOOFED_URL}" ] || [ "${SPOOFED_URL}" = "null" ]; then
              WILD_JSON=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/WildKernels/GKI_KernelSU_SUSFS/releases")
              SPOOFED_URL=$(echo "${WILD_JSON}" | jq -r '.[].assets[]? | select((.name | endswith(".apk")) and (.name | ascii_downcase | contains("next")) and (.name | ascii_downcase | contains("spoof"))) | .browser_download_url' | head -n 1)
              if [ -z "${NORMAL_URL}" ] || [ "${NORMAL_URL}" = "null" ]; then
                NORMAL_URL=$(echo "${WILD_JSON}" | jq -r '.[].assets[]? | select((.name | endswith(".apk")) and (.name | ascii_downcase | contains("next")) and ((.name | ascii_downcase | contains("spoof")) | not)) | .browser_download_url' | head -n 1)
              fi
            fi

            if [ -n "${NORMAL_URL}" ] && [ "${NORMAL_URL}" != "null" ] && [ -n "${SPOOFED_URL}" ] && [ "${SPOOFED_URL}" != "null" ]; then
              NORMAL_APK="KernelSU_Next_Manager_${MGR_TAG}-normal.apk"
              SPOOFED_APK="KernelSU_Next_Manager_${MGR_TAG}-spoofed.apk"
              curl -L "${NORMAL_URL}" -o "${NORMAL_APK}"
              curl -L "${SPOOFED_URL}" -o "${SPOOFED_APK}"
              echo "NORMAL_MANAGER_APK=${NORMAL_APK}" >> $GITHUB_ENV
              echo "SPOOFED_MANAGER_APK=${SPOOFED_APK}" >> $GITHUB_ENV
              echo "MANAGER_VERSION=${MGR_TAG}" >> $GITHUB_ENV
            else
              echo "::notice::Salah satu varian APK tidak ditemukan di aset rilis, beralih ke kompilasi otomatis keduanya dari latest commit source..."
              build_managers_from_source
            fi
            echo "::endgroup::"
          else
            build_managers_from_source
          fi

      - name: 15. Kemas Kernel menjadi Flashable ZIP (AnyKernel3) & Siapkan Catatan Rilis Commit Terbaru
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f "kernel_src/out/arch/arm64/boot/Image" ]; then
            cp kernel_src/out/arch/arm64/boot/Image AnyKernel3/
          elif [ -f "kernel_src/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel_src/out/arch/arm64/boot/Image.gz AnyKernel3/
          fi

          cat << EOF > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          properties() { '
          kernel.string=Xiaomi 17 Ultra (SM8850) KernelSU-Next + WildKernels
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${{ inputs.device_codename }}
          device.name2=pudding
          device.name3=pandora
          device.name4=popsicle
          supported.versions=16
          supported.patchlevels=
          '; }

          block=boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          EOF

          BUILD_DATE="$(date +%Y%m%d-%H%M)"
          KVER=$(make -s -C kernel_src kernelversion)
          ZIP_NAME="Wild-KSUNext-${KVER}-SM8850-${{ inputs.device_codename }}-${BUILD_DATE}-AnyKernel3.zip"
          CONFIG_NAME="config-${KVER}-${{ inputs.device_codename }}-${BUILD_DATE}.txt"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder
          cd ..

          cp kernel_src/out/.config "${CONFIG_NAME}"
          ZIP_SHA256=$(sha256sum "${ZIP_NAME}" | awk '{print $1}')
          NORMAL_APK_SHA256=$(sha256sum "${NORMAL_MANAGER_APK}" | awk '{print $1}')
          SPOOFED_APK_SHA256=$(sha256sum "${SPOOFED_MANAGER_APK}" | awk '{print $1}')

          # Buat catatan rilis lengkap dengan SHA Commit Terbaru dari setiap fitur
          cat << EOF > release_notes.md
          ### Xiaomi 17 Ultra (\`${{ inputs.device_codename }}\` / SM8850) — Linux \`${KVER}\` (KernelSU-Next + WildKernels)

          #### Informasi Build & Manajer
          * **Perangkat Target**: Xiaomi 17 Ultra (\`${{ inputs.device_codename }}\`) & Xiaomi 17 Series (\`sm8850\`)
          * **Versi Kernel**: \`${KVER}-android16-Wild-KSUNext\`
          * **Normal Manager APK**: \`${NORMAL_MANAGER_APK}\` (\`com.rifsxd.ksunext\`)
          * **Spoofed Manager APK**: \`${SPOOFED_MANAGER_APK}\` (Package Name tersamar)
          * **Toolchain**: AOSP LLVM/Clang (\`${CLANG_VERSION}\`)

          #### Matriks Revisi Latest Commit (\`HEAD\`) Saat Build
          | Fitur / Komponen | Repositori Sumber | Branch | Commit SHA (\`HEAD\`) |
          | :--- | :--- | :--- | :--- |
          | **Base Kernel SM8850** | \`YuzakiKokuban/android_kernel_xiaomi_sm8850\` | \`${{ inputs.kernel_branch }}\` | \`${KERNEL_COMMIT}\` |
          | **KernelSU-Next** | \`pershoot/KernelSU-Next\` | \`${{ inputs.ksu_branch }}\` | \`${KSUN_SHA}\` |
          | **SUSFS (\`susfs4ksu\`)** | \`simonpunk/susfs4ksu\` | \`${SUSFS_BRANCH}\` | \`${SUSFS_SHA}\` |
          | **NoMount VFS** | \`maxsteeel/nomount\` | \`${NOMOUNT_BRANCH}\` | \`${NOMOUNT_SHA}\` |
          | **Baseband Guard (BBG)** | \`vc-teahouse/Baseband-guard\` | \`${BBG_BRANCH}\` | \`${BBG_SHA}\` |
          | **Networking (BBRv3, WireGuard, IPSet, CIFS) & BPF (BTF, eBPF, FUSE-BPF)** | \`WildKernels/kernel_patches\` + In-Tree 6.12 | \`${WILD_PATCHES_BRANCH}\` | \`${WILD_PATCHES_SHA}\` |
          | **DroidSpaces + TMPFS (\`xattr\` / \`POSIX ACLs\`)** | \`ravindu644/Droidspaces-OSS\` | \`${DROIDSPACES_BRANCH}\` | \`${DROIDSPACES_SHA}\` |
          | **AnyKernel3 Packager** | \`osm0sis/AnyKernel3\` | \`master\` | \`${AK3_SHA}\` |

          #### Verifikasi Checksum (SHA-256)
          \`\`\`text
          ${ZIP_SHA256}  ${ZIP_NAME}
          ${NORMAL_APK_SHA256}  ${NORMAL_MANAGER_APK}
          ${SPOOFED_APK_SHA256}  ${SPOOFED_MANAGER_APK}
          \`\`\`
          EOF

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "CONFIG_NAME=${CONFIG_NAME}" >> $GITHUB_ENV
          echo "KVER=${KVER}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${KVER}-${{ inputs.device_codename }}-${BUILD_DATE}" >> $GITHUB_ENV

      - name: 16. Upload Artifact AnyKernel3 ZIP, 2 Manager APK (Normal & Spoofed) & .config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.NORMAL_MANAGER_APK }}
            ${{ env.SPOOFED_MANAGER_APK }}
            ${{ env.CONFIG_NAME }}
          retention-days: 14

      - name: 17. Buat GitHub Release Otomatis (Beserta Tabel Commit SHA & 2 Manager APK)
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Xiaomi 17 Ultra (SM8850) Kernel ${KVER} — Wild-KSUNext (${{ env.BUILD_DATE }})"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.NORMAL_MANAGER_APK }}
            ${{ env.SPOOFED_MANAGER_APK }}
            ${{ env.CONFIG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
